button{font:inherit}.top{position:fixed;z-index:20;top:18px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand,.top button{pointer-events:auto}.brand{font-size:13px;color:var(--muted);letter-spacing:.4px}.brand b{color:var(--cyan)}.tools{display:flex;gap:8px}.tools button,.nav button{border:1px solid #35516d;background:#102238;color:var(--text);border-radius:12px;padding:8px 13px;cursor:pointer}.tools button:hover,.nav button:hover{border-color:var(--cyan);color:var(--cyan)}

.deck{height:100%;width:100%;position:relative}.slide{position:absolute;inset:0;padding:78px 5vw 78px;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(380px,.98fr);gap:3vw;align-items:center;opacity:0;visibility:hidden;transform:translateY(16px) scale(.99);transition:opacity .45s,transform .45s,visibility .45s}.slide.active{opacity:1;visibility:visible;transform:none}.copy{max-width:760px}.eyebrow{font-size:13px;color:var(--cyan);font-weight:800;letter-spacing:.7px;margin-bottom:10px}.copy h1{font-size:clamp(32px,4.1vw,62px);line-height:1.35;margin:0 0 18px;font-weight:900}.copy h1 em{font-style:normal;color:var(--cyan)}.lead{font-size:clamp(16px,1.35vw,21px);color:#d3dfef;line-height:2;margin:0 0 20px}.points{list-style:none;margin:0;padding:0;display:grid;gap:10px}.points li{font-size:clamp(14px,1.05vw,17px);line-height:1.9;color:var(--muted);padding-right:20px;position:relative}.points li:before{content:"";position:absolute;right:0;top:13px;width:8px;height:8px;background:var(--cyan);border-radius:2px;transform:rotate(45deg)}.points b{color:var(--text)}.say{margin-top:20px;padding:13px 16px;background:#10263a;border-right:3px solid var(--gold);border-radius:10px;color:#dce8f7;font-size:14px;line-height:1.9}.say small{display:block;color:var(--gold);font-weight:800;margin-bottom:4px}.speaker{display:inline-flex;align-items:center;gap:7px;margin-top:14px;color:var(--cyan);font-size:12px;border:1px solid #2e5963;padding:5px 10px;border-radius:99px}
.visual{height:min(66vh,650px);min-height:380px;position:relative;border:1px solid #28435b;border-radius:26px;background:linear-gradient(145deg,rgba(18,39,61,.94),rgba(8,20,34,.94));box-shadow:0 30px 90px #0007;overflow:hidden;display:grid;place-items:center;isolation:isolate}.visual:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#29435b22 1px,transparent 1px),linear-gradient(90deg,#29435b22 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.scene-label{position:absolute;top:18px;right:20px;color:#8ea8c4;font-size:11px;letter-spacing:1px;z-index:5}.scene{position:relative;width:100%;height:100%;display:grid;place-items:center;z-index:1}.chip{display:grid;place-items:center;border:2px solid #9caec4;background:linear-gradient(145deg,#34445d,#111d30);box-shadow:8px 12px 0 #081321,0 0 35px #45e2ce33;color:#f3f7ff;border-radius:12px;font-weight:900;position:relative}.chip:after{content:"";position:absolute;inset:8px;border:1px solid #8da1b955;border-radius:5px}.cpu{width:150px;height:150px;font-size:27px}.cpu:before{content:"";position:absolute;inset:-18px;border:5px dashed #d6b66c;border-radius:18px;opacity:.7}.board{width:78%;height:72%;border-radius:18px;border:2px solid #317a78;background:linear-gradient(135deg,#12433f,#0b263b);box-shadow:0 22px 0 #061521,0 35px 60px #0009;position:relative;transform:perspective(900px) rotateX(9deg) rotateZ(-4deg);transition:transform .8s}.part{position:absolute;border:1px solid #63839b;background:linear-gradient(145deg,#263d58,#111e31);border-radius:7px;display:grid;place-items:center;color:#dbe8f8;font-size:12px;font-weight:800;box-shadow:3px 5px 0 #071321}.part.cpu{width:23%;height:26%;top:28%;left:37%;font-size:20px}.part.bios{width:13%;height:12%;bottom:12%;left:13%;border-color:var(--gold);color:var(--gold)}.part.ram{width:9%;height:42%;top:16%;right:13%;background:repeating-linear-gradient(0deg,#1c3550 0 12px,#b6a15e 12px 15px)}.part.pch{width:15%;height:15%;bottom:15%;right:25%}.part.bat{width:11%;aspect-ratio:1;border-radius:50%;bottom:10%;left:42%;background:radial-gradient(circle,#e4e9f0,#7d8b9d);color:#233}.part.gpu{width:50%;height:9%;bottom:3%;left:26%;background:#16283d}.trace{position:absolute;height:2px;background:var(--cyan);opacity:.6;transform-origin:right;animation:flow 1.8s linear infinite}.t1{width:23%;top:48%;left:15%}.t2{width:25%;top:40%;right:15%}.t3{width:25%;bottom:30%;left:28%;transform:rotate(30deg)}@keyframes flow{0%{filter:brightness(.5)}50%{filter:brightness(2);box-shadow:0 0 12px var(--cyan)}100%{filter:brightness(.5)}}
.diagram{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:88%}.node{min-width:105px;padding:17px 12px;text-align:center;border:1px solid #46627d;border-radius:13px;background:#142b43;color:#dceaff;font-weight:800;box-shadow:0 8px 18px #0005}.node.hot{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 24px #45e2ce33}.arrow{color:var(--cyan);font-size:26px;animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.25;transform:translateX(-5px)}}
.bootscreen{width:82%;background:#03090e;border:1px solid #31513f;border-radius:15px;padding:25px;color:#67e69c;font:14px/2 'Courier New',monospace;direction:ltr;text-align:left;box-shadow:0 0 45px #45e2ce22}.bootline{opacity:0;animation:showline .6s forwards}.bootline:nth-child(1){animation-delay:.2s}.bootline:nth-child(2){animation-delay:.8s}.bootline:nth-child(3){animation-delay:1.4s}.bootline:nth-child(4){animation-delay:2s}.bootline:nth-child(5){animation-delay:2.6s}@keyframes showline{to{opacity:1}}
.ramsticks{display:flex;gap:16px;align-items:end;height:210px}.stick{height:190px;width:46px;border:2px solid #8a9db2;border-radius:6px 6px 2px 2px;background:repeating-linear-gradient(0deg,#1b3450 0 20px,#c4a45d 20px 24px);position:relative;animation:ramin 2.4s infinite}.stick:nth-child(2){animation-delay:.3s}.stick:nth-child(3){animation-delay:.6s}@keyframes ramin{0%,100%{filter:brightness(.65);transform:translateY(0)}50%{filter:brightness(1.5);transform:translateY(-9px);box-shadow:0 0 28px #45e2ce66}}

.footer{position:fixed;z-index:20;bottom:18px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;color:#8197af;font-size:12px}.nav{display:flex;gap:8px;align-items:center}.nav button{min-width:44px}.counter{font-variant-numeric:tabular-nums;color:#b8c8dc}.notes{position:fixed;z-index:30;left:24px;bottom:66px;width:min(520px,45vw);max-height:40vh;overflow:auto;padding:16px 18px;border:1px solid #41627d;border-radius:15px;background:#091827f2;box-shadow:0 20px 60px #0009;line-height:2;font-size:14px;display:none}.notes.show{display:block}.notes b{color:var(--gold)}.split{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.split span{border:1px solid #36556e;color:#b9cce0;padding:5px 9px;border-radius:99px;font-size:11px}.cover{text-align:center;grid-template-columns:1fr}.cover .copy{margin:auto;max-width:900px}.cover .visual{position:absolute;inset:12% 8%;height:76%;opacity:.23;z-index:-1}.cover .copy h1{font-size:clamp(48px,7vw,92px)}.cover .lead{max-width:750px;margin:0 auto 20px}.cover .points{max-width:620px;margin:auto;text-align:right}.cover .say{max-width:700px;margin:20px auto}.cover .speaker{margin:auto}
@media(max-width:900px){.slide{grid-template-columns:1fr;padding:72px 22px 82px;gap:14px;overflow:auto}.visual{height:34vh;min-height:240px;order:-1}.copy h1{font-size:30px}.lead{font-size:15px}.points li{font-size:13px}.say{font-size:12px}.notes{width:calc(100% - 32px);left:16px;bottom:64px}.top,.footer{left:12px;right:12px}.brand{display:none}}

<script>
const slides=[
{title:'BIOS؛ مغز راه‌انداز کامپیوتر',tag:'ارائه درس مبانی کامپیوتر',lead:'از لحظه فشردن دکمه پاور تا اجرای سیستم‌عامل، چه اتفاقی درون کامپیوتر می‌افتد؟',bullets:['ارائه‌دهندگان: <b>احسان نامی</b> و <b>هم‌گروهی</b>','استاد: <b>هلیا کوشا</b>','موضوع: ساختار، وظایف و روند راه‌اندازی BIOS و UEFI'],speaker:'احسان',note:'سلام و وقت بخیر. موضوع ارائه ما BIOS و نقش آن در راه‌اندازی کامپیوتر است. در این ارائه مسیر روشن شدن سیستم را مرحله‌به‌مرحله بررسی می‌کنیم؛ از اولین دستور پردازنده تا تحویل کنترل به سیستم‌عامل.',scene:'board',label:'نمای کلی مادربرد'},
{title:'نقشه راه ارائه',tag:'مقدمه',lead:'برای فهم BIOS، ابتدا جایگاه آن را در مجموعه سخت‌افزار و نرم‌افزار مشخص می‌کنیم.',bullets:['۱. مادربرد و مفهوم Firmware','۲. تعریف و تاریخچه BIOS','۳. POST، RAM و CMOS','۴. تنظیمات و فرایند بوت','۵. UEFI، امنیت و به‌روزرسانی'],speaker:'احسان',note:'ابتدا مادربرد و مفهوم فرم‌ور را معرفی می‌کنیم. سپس به تاریخچه و حافظه BIOS می‌رسیم. در ادامه مراحل بررسی قطعات و بوت را می‌بینیم و در پایان تفاوت UEFI و نکات امنیتی را جمع‌بندی می‌کنیم.',scene:'flow',label:'مسیر مباحث'},
{title:'مادربرد چیست؟',tag:'بخش اول · سخت‌افزار',lead:'مادربرد برد اصلی رایانه است و ارتباط میان قطعات را برقرار می‌کند.',bullets:['پردازنده، حافظه RAM و کارت‌های توسعه به آن متصل می‌شوند.','مسیرهای الکتریکی، داده و سیگنال‌های کنترلی را منتقل می‌کنند.','تراشه Firmware نیز روی مادربرد قرار دارد.'],speaker:'احسان',note:'مادربرد را می‌توان بستر اصلی ارتباط قطعات دانست. قطعاتی مانند پردازنده و حافظه روی آن نصب می‌شوند یا از طریق درگاه‌ها به آن متصل هستند. BIOS یا UEFI نیز روی یک تراشه حافظه روی مادربرد ذخیره می‌شود.',scene:'board',label:'اجزای اصلی مادربرد'},
{title:'Firmware چیست؟',tag:'مفهوم پایه',lead:'Firmware نرم‌افزار سطح پایینی است که وظایف پایه یک دستگاه را کنترل می‌کند.',bullets:['بین سخت‌افزار و نرم‌افزارهای سطح بالاتر قرار می‌گیرد.','معمولاً در حافظه غیرفرار ذخیره می‌شود.','BIOS و UEFI نمونه‌هایی از Firmware مادربرد هستند.'],speaker:'احسان',note:'فرم‌ور نوعی نرم‌افزار نزدیک به سخت‌افزار است. برخلاف برنامه‌های معمولی، وظیفه آن کنترل و آماده‌سازی اولیه دستگاه است. BIOS و UEFI فرم‌ورهایی هستند که پیش از اجرای سیستم‌عامل فعال می‌شوند.',scene:'layers',label:'جایگاه Firmware'},
{title:'BIOS چیست؟',tag:'تعریف اصلی',lead:'BIOS مخفف Basic Input/Output System است؛ فرم‌ور سنتی رایانه‌های شخصی.',bullets:['پس از روشن شدن سیستم، پردازنده اجرای کد اولیه را آغاز می‌کند.','BIOS سخت‌افزارهای ضروری را بررسی و آماده می‌کند.','سپس فرایند یافتن و اجرای راه‌انداز سیستم‌عامل را آغاز می‌کند.'],speaker:'احسان',note:'BIOS مخفف عبارت Basic Input/Output System است. این نام بیشتر برای فرم‌ور سنتی رایانه‌های شخصی به کار می‌رود. وظیفه اصلی آن آماده‌سازی اولیه سخت‌افزار و آغاز فرایند بوت است. در رایانه‌های امروزی معمولاً با UEFI روبه‌رو هستیم.',scene:'bios',label:'تراشه BIOS روی مادربرد'},
{title:'تاریخچه‌ای کوتاه',tag:'از BIOS تا UEFI',lead:'فناوری راه‌اندازی رایانه همراه با پیچیده‌تر شدن سخت‌افزار تکامل پیدا کرد.',bullets:['۱۹۸۱: رایانه IBM PC از BIOS استفاده کرد.','در سال‌های بعد، شرکت‌هایی مانند AMI و Phoenix BIOSهای سازگار عرضه کردند.','UEFI به‌عنوان رویکردی مدرن‌تر برای راه‌اندازی رایانه توسعه یافت.'],speaker:'هم‌گروهی',note:'BIOS در رایانه IBM PC در سال ۱۹۸۱ نقش مهمی پیدا کرد. در سال‌های بعد شرکت‌هایی مانند AMI و Phoenix نسخه‌های سازگار تولید کردند. با افزایش محدودیت‌های روش قدیمی، استاندارد UEFI توسعه یافت تا امکانات جدیدتری برای راه‌اندازی و مدیریت سخت‌افزار فراهم شود.',scene:'timeline',label:'تکامل فناوری راه‌اندازی'},
{title:'حافظه BIOS',tag:'ذخیره‌سازی Firmware',lead:'کد Firmware در حافظه‌ای غیرفرار نگهداری می‌شود؛ یعنی با قطع برق پاک نمی‌شود.',bullets:['در رایانه‌های قدیمی از ROM و انواع قابل‌برنامه‌ریزی آن استفاده می‌شد.','امروزه معمولاً از حافظه Flash استفاده می‌شود.','حافظه Flash امکان به‌روزرسانی Firmware را فراهم می‌کند.'],speaker:'هم‌گروهی',note:'کد BIOS باید حتی وقتی کامپیوتر خاموش است باقی بماند؛ به همین دلیل در حافظه غیرفرار ذخیره می‌شود. در سیستم‌های قدیمی‌تر از ROM و گونه‌های آن استفاده می‌شد و در مادربردهای جدید معمولاً حافظه فلش به کار می‌رود که قابل بازنویسی است.',scene:'flash',label:'حافظه فلش Firmware'},
{title:'POST؛ خودآزمایی هنگام روشن شدن',tag:'Power-On Self-Test',lead:'POST مجموعه‌ای از بررسی‌های اولیه است که پس از روشن شدن رایانه انجام می‌شود.',bullets:['پردازنده، حافظه و برخی دستگاه‌های ضروری بررسی می‌شوند.','در صورت بروز خطا، ممکن است کد صوتی یا چراغ خطا نمایش داده شود.','نوع و معنی کدها به سازنده مادربرد وابسته است.'],speaker:'هم‌گروهی',note:'POST مخفف Power-On Self-Test است. سیستم در این مرحله بررسی می‌کند که قطعات ضروری برای ادامه راه‌اندازی در دسترس و قابل استفاده باشند. اگر مشکلی وجود داشته باشد، بسته به مادربرد ممکن است بوق هشدار، چراغ عیب‌یابی یا پیام خطا دیده شود.',scene:'post',label:'گزارش مرحله POST'},
{title:'راه‌اندازی حافظه RAM',tag:'Memory Initialization',lead:'پیش از ادامه بوت، حافظه اصلی باید شناسایی و آماده استفاده شود.',bullets:['Firmware اطلاعات پایه ماژول حافظه را می‌خواند.','در بسیاری از سیستم‌ها، Memory Training برای تنظیم پارامترهای حافظه انجام می‌شود.','اختلال جدی در RAM می‌تواند مانع ادامه بوت شود.'],speaker:'هم‌گروهی',note:'در این مرحله Firmware اطلاعات ماژول‌های حافظه را شناسایی می‌کند. در بسیاری از سیستم‌های جدید، فرایندی به نام Memory Training انجام می‌شود تا پارامترهای ارتباطی حافظه تنظیم شوند. اگر حافظه یا تنظیمات آن مشکل جدی داشته باشد، سیستم ممکن است در همین مرحله متوقف شود.',scene:'ram',label:'شناسایی و آماده‌سازی RAM'},
{title:'CMOS و باتری مادربرد',tag:'نگهداری تنظیمات',lead:'باتری مادربرد در بسیاری از سیستم‌ها به حفظ ساعت و تنظیمات مشخصی کمک می‌کند.',bullets:['باتری رایج CR2032 معمولاً ولتاژی نزدیک به ۳ ولت دارد.','در طراحی‌های سنتی، تنظیمات BIOS در حافظه CMOS نگهداری می‌شد.','تمام شدن باتری می‌تواند باعث به‌هم‌خوردن ساعت و بازگشت برخی تنظیمات شود.'],speaker:'احسان',note:'باتری سکه‌ای روی مادربرد معمولاً از نوع CR2032 است. در طراحی‌های سنتی، این باتری برق موردنیاز مدار ساعت و حافظه تنظیمات CMOS را هنگام خاموش بودن سیستم تأمین می‌کرد. در مادربردهای جدید، جزئیات ذخیره‌سازی تنظیمات ممکن است متفاوت باشد؛ بنابراین نباید تصور کنیم تمام اطلاعات BIOS فقط با این باتری نگهداری می‌شوند.',scene:'battery',label:'باتری CMOS'},
{title:'ورود به BIOS / UEFI Setup',tag:'تنظیمات سیستم',lead:'کاربر می‌تواند پیش از ورود به سیستم‌عامل، برخی تنظیمات پایه را تغییر دهد.',bullets:['کلید ورود بسته به سازنده معمولاً Del یا F2 است.','ترتیب راه‌اندازی، تنظیمات سخت‌افزار و گزینه‌های امنیتی قابل مدیریت‌اند.','نام منوها و امکانات در مادربردهای مختلف یکسان نیست.'],speaker:'احسان',note:'برای ورود به محیط تنظیمات، معمولاً هنگام روشن شدن سیستم کلیدهایی مانند Delete یا F2 را فشار می‌دهیم. در این محیط می‌توان ترتیب بوت، برخی تنظیمات پردازنده و حافظه و گزینه‌های امنیتی را مدیریت کرد. کلید دقیق ورود به تنظیمات به سازنده دستگاه بستگی دارد.',scene:'setup',label:'محیط تنظیمات Firmware'},
{title:'ترتیب بوت (Boot Order)',tag:'انتخاب دستگاه راه‌انداز',lead:'Firmware بر اساس تنظیمات، دستگاه یا ورودی مناسب برای آغاز سیستم‌عامل را انتخاب می‌کند.',bullets:['دستگاه‌ها می‌توانند SSD، HDD، حافظه USB یا شبکه باشند.','کاربر می‌تواند اولویت دستگاه‌ها را تغییر دهد.','در حالت UEFI معمولاً ورودی‌های راه‌اندازی مشخصی نمایش داده می‌شوند.'],speaker:'احسان',note:'فرض کنید هم یک SSD و هم یک فلش USB به کامپیوتر وصل است. ترتیب بوت مشخص می‌کند سیستم ابتدا کدام گزینه را بررسی کند. اگر هدف نصب سیستم‌عامل از روی فلش باشد، باید USB را در اولویت مناسب قرار دهیم.',scene:'bootorder',label:'تغییر اولویت بوت'},
{title:'فرایند بوت چگونه انجام می‌شود؟',tag:'از روشن شدن تا سیستم‌عامل',lead:'بوت فرایندی مرحله‌ای است که کنترل را از Firmware به راه‌انداز و سپس سیستم‌عامل منتقل می‌کند.',bullets:['۱. روشن شدن و آغاز اجرای Firmware','۲. بررسی و آماده‌سازی سخت‌افزار','۳. انتخاب ورودی بوت','۴. اجرای Bootloader','۵. بارگذاری سیستم‌عامل'],speaker:'هم‌گروهی',note:'فرایند بوت را به پنج مرحله ساده تقسیم می‌کنیم. ابتدا سیستم روشن می‌شود و Firmware اجرا می‌شود. سپس سخت‌افزارهای ضروری آماده می‌شوند. بعد دستگاه بوت انتخاب می‌شود، Bootloader اجرا می‌شود و در نهایت سیستم‌عامل بارگذاری می‌شود.',scene:'boot',label:'نمایش مرحله‌ای فرایند بوت'},
{title:'MBR و GPT',tag:'ساختار پارتیشن‌بندی',lead:'MBR و GPT دو روش متفاوت برای سازمان‌دهی جدول پارتیشن دیسک هستند.',bullets:['MBR قدیمی‌تر است و محدودیت‌هایی در اندازه دیسک و تعداد پارتیشن‌ها دارد.','GPT روش جدیدتری است و برای دیسک‌های بزرگ‌تر مناسب است.','در بوت UEFI، معمولاً فایل راه‌انداز از پارتیشن EFI System خوانده می‌شود.'],speaker:'هم‌گروهی',note:'MBR و GPT خودِ BIOS نیستند؛ این دو روش برای نگهداری اطلاعات پارتیشن‌های دیسک هستند. MBR قدیمی‌تر است و محدودیت‌هایی دارد. GPT روش جدیدتر است. در بسیاری از نصب‌های مدرن، UEFI فایل راه‌انداز را از پارتیشن EFI System که معمولاً با FAT32 قالب‌بندی شده اجرا می‌کند.',scene:'disk',label:'ساختار دیسک و پارتیشن'},
{title:'BIOS سنتی در برابر UEFI',tag:'مقایسه',lead:'UEFI استاندارد مدرن‌تری برای راه‌اندازی سیستم است و محدودیت‌های زیادی از روش سنتی را برطرف می‌کند.',bullets:['BIOS سنتی بر پایه سازوکارهای قدیمی و محدودیت‌های MBR شکل گرفته است.','UEFI از GPT و قابلیت‌های پیشرفته‌تر بوت پشتیبانی می‌کند.','رابط گرافیکی یا پشتیبانی از ماوس ممکن است وجود داشته باشد، اما ویژگی تعریف‌کننده UEFI نیست.'],speaker:'هم‌گروهی',note:'یک نکته مهم این است که UEFI فقط یک BIOS با ظاهر گرافیکی نیست. UEFI یک استاندارد مستقل‌تر و مدرن‌تر برای رابط میان Firmware و فرایند بوت است. پشتیبانی از GPT، ساختار ماژولارتر و امکانات امنیتی از تفاوت‌های مهم آن هستند. داشتن محیط گرافیکی یا ماوس به طراحی سازنده بستگی دارد.',scene:'compare',label:'مقایسه دو نسل راه‌اندازی'},
{title:'Secure Boot و امنیت',tag:'امنیت فرایند بوت',lead:'Secure Boot کمک می‌کند کدهای راه‌انداز غیرمجاز پیش از اجرا شناسایی شوند.',bullets:['امضای دیجیتال اجزای مجاز بوت بررسی می‌شود.','این قابلیت می‌تواند خطر برخی Bootkitها را کاهش دهد.','Secure Boot جایگزین آنتی‌ویروس یا تمام لایه‌های امنیتی نیست.'],speaker:'احسان',note:'Secure Boot قابلیتی در محیط UEFI است که اعتبار امضای دیجیتال اجزای زنجیره بوت را بررسی می‌کند. هدف آن جلوگیری از اجرای برخی کدهای غیرمجاز پیش از بارگذاری سیستم‌عامل است. البته این قابلیت به‌تنهایی امنیت کامل ایجاد نمی‌کند و باید در کنار به‌روزرسانی‌ها و ابزارهای امنیتی دیگر باشد.',scene:'secure',label:'بررسی امضای دیجیتال'},
{title:'به‌روزرسانی BIOS / UEFI',tag:'Firmware Update',lead:'به‌روزرسانی می‌تواند سازگاری، پایداری یا امنیت سیستم را بهبود دهد؛ اما باید با دقت انجام شود.',bullets:['فقط فایل مخصوص مدل دقیق مادربرد یا لپ‌تاپ را دریافت کنید.','دستورالعمل سازنده را مرحله‌به‌مرحله دنبال کنید.','قطع برق یا استفاده از فایل اشتباه ممکن است سیستم را غیرقابل بوت کند.'],speaker:'احسان',note:'به‌روزرسانی Firmware ممکن است برای رفع اشکال، پشتیبانی از پردازنده جدید یا برطرف کردن آسیب‌پذیری امنیتی منتشر شود. این کار باید فقط با فایل رسمی و مخصوص مدل دقیق دستگاه انجام شود. هنگام به‌روزرسانی نباید برق قطع شود و بهتر است بدون نیاز واقعی، این کار را انجام ندهیم.',scene:'update',label:'فرایند به‌روزرسانی'},
{title:'جمع‌بندی',tag:'نتیجه‌گیری',lead:'BIOS و UEFI نقطه آغاز راه‌اندازی رایانه‌اند؛ اما تمام کار سیستم را انجام نمی‌دهند.',bullets:['Firmware سخت‌افزار را بررسی و آماده می‌کند.','سپس دستگاه بوت و Bootloader اجرا می‌شود.','در نهایت سیستم‌عامل کنترل سیستم را به دست می‌گیرد.'],speaker:'هر دو',note:'در جمع‌بندی، Firmware نخستین بخش مهم فرایند راه‌اندازی است. قطعات ضروری را بررسی و آماده می‌کند و سپس اجرای راه‌انداز سیستم‌عامل را آغاز می‌کند. پس BIOS یا UEFI پلی میان روشن شدن سخت‌افزار و آغاز اجرای سیستم‌عامل است.',scene:'flow',label:'مسیر نهایی راه‌اندازی'},
{title:'پرسش و پاسخ',tag:'سپاس از توجه شما',lead:'ممنون از توجه شما. خوشحال می‌شویم به پرسش‌های شما پاسخ دهیم.',bullets:['احسان نامی و هم‌گروهی','موضوع: BIOS و UEFI','منابع مطالعه: مستندات UEFI Forum و راهنماهای رسمی سازندگان مادربرد'],speaker:'هر دو',note:'از استاد و دوستان بابت توجه‌شان تشکر می‌کنیم. اگر پرسشی درباره مراحل POST، تفاوت BIOS و UEFI یا فرایند بوت وجود دارد، پاسخ‌گو هستیم.',scene:'board',label:'پایان ارائه'}
];
const deck=document.getElementById('deck');
function sceneHTML(type,label){let body='';if(type==='board'||type==='bios')body=`<div class="board"><div class="trace t1"></div><div class="trace t2"></div><div class="trace t3"></div><div class="part cpu">CPU</div><div class="part bios">BIOS</div><div class="part ram"></div><div class="part pch">PCH</div><div class="part bat">CMOS</div><div class="part gpu">PCIe / GPU</div></div>`;
else if(type==='flow'||type==='layers')body=`<div class="diagram">${(type==='layers'?['سخت‌افزار','Firmware','Bootloader','سیستم‌عامل','برنامه‌ها']:['روشن شدن','POST','انتخاب بوت','Bootloader','سیستم‌عامل']).map((x,i)=>`${i?'<span class="arrow">←</span>':''}<div class="node ${i===1?'hot':''}">${x}</div>`).join('')}</div>`;
else if(type==='post')body=`<div class="bootscreen"><div class="bootline">Power on self test</div><div class="bootline">CPU ................. OK</div><div class="bootline">Memory .............. CHECK</div><div class="bootline">Display ............. OK</div><div class="bootline">POST completed</div></div>`;
else if(type==='ram')body=`<div><div class="ramsticks"><i class="stick"></i><i class="stick"></i><i class="stick"></i></div><div style="text-align:center;color:var(--cyan);margin-top:25px">Memory Training · آماده‌سازی حافظه</div></div>`;
else if(type==='battery')body=`<div style="text-align:center"><div class="battery">CR2032</div><p style="color:var(--muted);margin-top:28px">حدود ۳ ولت</p></div>`;
else if(type==='disk')body=`<div style="display:grid;place-items:center;gap:25px"><div class="disk"></div><div class="diagram"><div class="node">MBR</div><div class="node hot">GPT</div><div class="node">EFI System</div></div></div>`;
else if(type==='secure')body=`<div style="text-align:center"><div class="secure">✓</div><div style="color:var(--cyan);font-weight:800;margin-top:20px">Signature verified</div><div style="color:var(--muted);font-size:13px;margin-top:8px">بررسی اعتبار امضای بوت‌لودر</div></div>`;
else if(type==='update')body=`<div style="width:75%;text-align:center"><div class="chip" style="width:150px;height:115px;margin:0 auto 35px;color:var(--gold)">FLASH</div><div style="height:13px;background:#233a50;border-radius:99px;overflow:hidden"><i style="display:block;width:80%;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));animation:load 4s ease-in-out infinite alternate"></i></div><p style="color:var(--gold);font-size:13px">Firmware update · Do not power off</p></div>`;
else if(type==='boot')body=`<div class="bootscreen"><div class="bootline">[ 01 ] Power on</div><div class="bootline">[ 02 ] POST / Hardware init</div><div class="bootline">[ 03 ] Select boot device</div><div class="bootline">[ 04 ] Start bootloader</div><div class="bootline">[ 05 ] Load operating system</div></div>`;
else if(type==='setup')body=`<div class="bootscreen"><div style="color:#b9d7ff;font-weight:bold">UEFI FIRMWARE SETUP</div><div class="bootline">Main       Advanced       Boot</div><div class="bootline">Security   Save & Exit</div><div class="bootline">Boot Option #1 : NVMe SSD</div><div class="bootline">Secure Boot : Enabled</div><div class="bootline">Press F10 to Save & Exit</div></div>`;
else if(type==='bootorder')body=`<div style="width:75%;display:grid;gap:12px">${['1  NVMe SSD','2  USB Storage','3  Network Boot'].map((x,i)=>`<div class="node ${i===0?'hot':''}" style="text-align:right">${x}</div>`).join('')}<div style="color:var(--muted);font-size:12px;text-align:center">اولویت راه‌اندازی</div></div>`;
else if(type==='compare')body=`<div class="diagram" style="align-items:stretch"><div class="node" style="min-width:145px"><b>BIOS سنتی</b><p style="font-size:12px;color:var(--muted)">روش قدیمی<br>محدودیت‌های بیشتر</p></div><div class="node hot" style="min-width:145px"><b>UEFI</b><p style="font-size:12px;color:var(--muted)">استاندارد مدرن<br>قابلیت‌های گسترده‌تر</p></div></div>`;
else if(type==='flash')body=`<div style="text-align:center"><div class="chip" style="width:170px;height:125px;color:var(--gold);font-size:20px">SPI FLASH</div><div class="arrow" style="margin-top:30px">↻</div><p style="color:var(--muted)">ذخیره‌سازی غیرفرار Firmware</p></div>`;
else if(type==='timeline')body=`<div style="width:85%;display:grid;gap:25px"><div class="diagram"><div class="node">۱۹۸۱<br><small>IBM PC</small></div><span class="arrow">←</span><div class="node">BIOS سازگار</div><span class="arrow">←</span><div class="node hot">UEFI</div></div><p style="text-align:center;color:var(--muted)">تکامل استانداردهای راه‌اندازی رایانه</p></div>`;
return `<div class="visual"><div class="scene-label">${label}</div><div class="scene">${body}</div></div>`}
slides.forEach((s,i)=>{let el=document.createElement('section');el.className='slide'+(i===0?' active':'')+(i===0||i===19?' cover':'');el.innerHTML=`<div class="copy"><div class="eyebrow">${s.tag}</div><h1>${s.title.replace('BIOS','<em>BIOS</em>').replace('UEFI','<em>UEFI</em>')}</h1><p class="lead">${s.lead}</p><ul class="points">${s.bullets.map(x=>`<li>${x}</li>`).join('')}</ul><div class="say"><small>متن پیشنهادی برای توضیح شفاهی</small>${s.note}</div><div class="speaker">گوینده: ${s.speaker}</div></div>${sceneHTML(s.scene,s.label)}`;deck.appendChild(el)});
let index=0;function show(n){index=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===index));document.getElementById('bar').style.width=((index+1)/slides.length*100)+'%';document.getElementById('counter').textContent=(index+1)+' / '+slides.length;let s=slides[index];document.getElementById('notes').innerHTML='<b>یادداشت تمرین · '+s.speaker+'</b><br>'+s.note;}
function next(){show(index+1)}function prev(){show(index-1)}function toggleNotes(){document.getElementById('notes').classList.toggle('show')}function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();prev()}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')toggleFull();if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)show(index+(d<0?1:-1))},{passive:true});show(0);
</script></body></html>
