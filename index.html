{title:'نقشه راه ارائه',tag:'مقدمه',lead:'برای فهم BIOS، ابتدا جایگاه آن را در مجموعه سخت‌افزار و نرم‌افزار مشخص می‌کنیم.',bullets:['۱. مادربرد و مفهوم Firmware','۲. تعریف و تاریخچه BIOS','۳. POST، RAM و CMOS','۴. تنظیمات و فرایند بوت','۵. UEFI، امنیت و به‌روزرسانی'],speaker:'رامیز',note:'ابتدا مادربرد و مفهوم فرم‌ور را معرفی می‌کنیم. سپس به تاریخچه و حافظه BIOS می‌رسیم. در ادامه مراحل بررسی قطعات و بوت را می‌بینیم و در پایان تفاوت UEFI و نکات امنیتی را جمع‌بندی می‌کنیم.',scene:'flow',label:'مسیر مباحث'},
{title:'مادربرد چیست؟',tag:'بخش اول · سخت‌افزار',lead:'مادربرد برد اصلی رایانه است و ارتباط میان قطعات را برقرار می‌کند.',bullets:['پردازنده، حافظه RAM و کارت‌های توسعه به آن متصل می‌شوند.','مسیرهای الکتریکی، داده و سیگنال‌های کنترلی را منتقل می‌کنند.','تراشه Firmware نیز روی مادربرد قرار دارد.'],speaker:'رامیز',note:'مادربرد را می‌توان بستر اصلی ارتباط قطعات دانست. قطعاتی مانند پردازنده و حافظه روی آن نصب می‌شوند یا از طریق درگاه‌ها به آن متصل هستند. BIOS یا UEFI نیز روی یک تراشه حافظه روی مادربرد ذخیره می‌شود.',scene:'board',label:'اجزای اصلی مادربرد'},
{title:'Firmware چیست؟',tag:'مفهوم پایه',lead:'Firmware نرم‌افزار سطح پایینی است که وظایف پایه یک دستگاه را کنترل می‌کند.',bullets:['بین سخت‌افزار و نرم‌افزارهای سطح بالاتر قرار می‌گیرد.','معمولاً در حافظه غیرفرار ذخیره می‌شود.','BIOS و UEFI نمونه‌هایی از Firmware مادربرد هستند.'],speaker:'رامیز',note:'فرم‌ور نوعی نرم‌افزار نزدیک به سخت‌افزار است. برخلاف برنامه‌های معمولی، وظیفه آن کنترل و آماده‌سازی اولیه دستگاه است. BIOS و UEFI فرم‌ورهایی هستند که پیش از اجرای سیستم‌عامل فعال می‌شوند.',scene:'layers',label:'جایگاه Firmware'},
{title:'BIOS چیست؟',tag:'تعریف اصلی',lead:'BIOS مخفف Basic Input/Output System است؛ فرم‌ور سنتی رایانه‌های شخصی.',bullets:['پس از روشن شدن سیستم، پردازنده اجرای کد اولیه را آغاز می‌کند.','BIOS سخت‌افزارهای ضروری را بررسی و آماده می‌کند.','سپس فرایند یافتن و اجرای راه‌انداز سیستم‌عامل را آغاز می‌کند.'],speaker:'رامیز',note:'BIOS مخفف عبارت Basic Input/Output System است. این نام بیشتر برای فرم‌ور سنتی رایانه‌های شخصی به کار می‌رود. وظیفه اصلی آن آماده‌سازی اولیه سخت‌افزار و آغاز فرایند بوت است. در رایانه‌های امروزی معمولاً با UEFI روبه‌رو هستیم.',scene:'bios',label:'تراشه BIOS روی مادربرد'},
{title:'تاریخچه‌ای کوتاه',tag:'از BIOS تا UEFI',lead:'فناوری راه‌اندازی رایانه همراه با پیچیده‌تر شدن سخت‌افزار تکامل پیدا کرد.',bullets:['۱۹۸۱: رایانه IBM PC از BIOS استفاده کرد.','در سال‌های بعد، شرکت‌هایی مانند AMI و Phoenix BIOSهای سازگار عرضه کردند.','UEFI به‌عنوان رویکردی مدرن‌تر برای راه‌اندازی رایانه توسعه یافت.'],speaker:'رامیز',note:'BIOS در رایانه IBM PC در سال ۱۹۸۱ نقش مهمی پیدا کرد. در سال‌های بعد شرکت‌هایی مانند AMI و Phoenix نسخه‌های سازگار تولید کردند. با افزایش محدودیت‌های روش قدیمی، استاندارد UEFI توسعه یافت تا امکانات جدیدتری برای راه‌اندازی و مدیریت سخت‌افزار فراهم شود.',scene:'timeline',label:'تکامل فناوری راه‌اندازی'},
{title:'حافظه BIOS',tag:'ذخیره‌سازی Firmware',lead:'کد Firmware در حافظه‌ای غیرفرار نگهداری می‌شود؛ یعنی با قطع برق پاک نمی‌شود.',bullets:['در رایانه‌های قدیمی از ROM و انواع قابل‌برنامه‌ریزی آن استفاده می‌شد.','امروزه معمولاً از حافظه Flash استفاده می‌شود.','حافظه Flash امکان به‌روزرسانی Firmware را فراهم می‌کند.'],speaker:'رامیز',note:'کد BIOS باید حتی وقتی کامپیوتر خاموش است باقی بماند؛ به همین دلیل در حافظه غیرفرار ذخیره می‌شود. در سیستم‌های قدیمی‌تر از ROM و گونه‌های آن استفاده می‌شد و در مادربردهای جدید معمولاً حافظه فلش به کار می‌رود که قابل بازنویسی است.',scene:'flash',label:'حافظه فلش Firmware'},
{title:'POST؛ خودآزمایی هنگام روشن شدن',tag:'Power-On Self-Test',lead:'POST مجموعه‌ای از بررسی‌های اولیه است که پس از روشن شدن رایانه انجام می‌شود.',bullets:['پردازنده، حافظه و برخی دستگاه‌های ضروری بررسی می‌شوند.','در صورت بروز خطا، ممکن است کد صوتی یا چراغ خطا نمایش داده شود.','نوع و معنی کدها به سازنده مادربرد وابسته است.'],speaker:'رامیز',note:'POST مخفف Power-On Self-Test است. سیستم در این مرحله بررسی می‌کند که قطعات ضروری برای ادامه راه‌اندازی در دسترس و قابل استفاده باشند. اگر مشکلی وجود داشته باشد، بسته به مادربرد ممکن است بوق هشدار، چراغ عیب‌یابی یا پیام خطا دیده شود.',scene:'post',label:'گزارش مرحله POST'},
{title:'راه‌اندازی حافظه RAM',tag:'Memory Initialization',lead:'پیش از ادامه بوت، حافظه اصلی باید شناسایی و آماده استفاده شود.',bullets:['Firmware اطلاعات پایه ماژول حافظه را می‌خواند.','در بسیاری از سیستم‌ها، Memory Training برای تنظیم پارامترهای حافظه انجام می‌شود.','اختلال جدی در RAM می‌تواند مانع ادامه بوت شود.'],speaker:'رامیز',note:'در این مرحله Firmware اطلاعات ماژول‌های حافظه را شناسایی می‌کند. در بسیاری از سیستم‌های جدید، فرایندی به نام Memory Training انجام می‌شود تا پارامترهای ارتباطی حافظه تنظیم شوند. اگر حافظه یا تنظیمات آن مشکل جدی داشته باشد، سیستم ممکن است در همین مرحله متوقف شود.',scene:'ram',label:'شناسایی و آماده‌سازی RAM'},
{title:'CMOS و باتری مادربرد',tag:'نگهداری تنظیمات',lead:'باتری مادربرد در بسیاری از سیستم‌ها به حفظ ساعت و تنظیمات مشخصی کمک می‌کند.',bullets:['باتری رایج CR2032 معمولاً ولتاژی نزدیک به ۳ ولت دارد.','در طراحی‌های سنتی، تنظیمات BIOS در حافظه CMOS نگهداری می‌شد.','تمام شدن باتری می‌تواند باعث به‌هم‌خوردن ساعت و بازگشت برخی تنظیمات شود.'],speaker:'احسان',note:'باتری سکه‌ای روی مادربرد معمولاً از نوع CR2032 است. در طراحی‌های سنتی، این باتری برق موردنیاز مدار ساعت و حافظه تنظیمات CMOS را هنگام خاموش بودن سیستم تأمین می‌کرد. در مادربردهای جدید، جزئیات ذخیره‌سازی تنظیمات ممکن است متفاوت باشد؛ بنابراین نباید تصور کنیم تمام اطلاعات BIOS فقط با این باتری نگهداری می‌شوند.',scene:'battery',label:'باتری CMOS'},
{title:'ورود به BIOS / UEFI Setup',tag:'تنظیمات سیستم',lead:'کاربر می‌تواند پیش از ورود به سیستم‌عامل، برخی تنظیمات پایه را تغییر دهد.',bullets:['کلید ورود بسته به سازنده معمولاً Del یا F2 است.','ترتیب راه‌اندازی، تنظیمات سخت‌افزار و گزینه‌های امنیتی قابل مدیریت‌اند.','نام منوها و امکانات در مادربردهای مختلف یکسان نیست.'],speaker:'احسان',note:'برای ورود به محیط تنظیمات، معمولاً هنگام روشن شدن سیستم کلیدهایی مانند Delete یا F2 را فشار می‌دهیم. در این محیط می‌توان ترتیب بوت، برخی تنظیمات پردازنده و حافظه و گزینه‌های امنیتی را مدیریت کرد. کلید دقیق ورود به تنظیمات به سازنده دستگاه بستگی دارد.',scene:'setup',label:'محیط تنظیمات Firmware'},
{title:'ترتیب بوت (Boot Order)',tag:'انتخاب دستگاه راه‌انداز',lead:'Firmware بر اساس تنظیمات، دستگاه یا ورودی مناسب برای آغاز سیستم‌عامل را انتخاب می‌کند.',bullets:['دستگاه‌ها می‌توانند SSD، HDD، حافظه USB یا شبکه باشند.','کاربر می‌تواند اولویت دستگاه‌ها را تغییر دهد.','در حالت UEFI معمولاً ورودی‌های راه‌اندازی مشخصی نمایش داده می‌شوند.'],speaker:'احسان',note:'فرض کنید هم یک SSD و هم یک فلش USB به کامپیوتر وصل است. ترتیب بوت مشخص می‌کند سیستم ابتدا کدام گزینه را بررسی کند. اگر هدف نصب سیستم‌عامل از روی فلش باشد، باید USB را در اولویت مناسب قرار دهیم.',scene:'bootorder',label:'تغییر اولویت بوت'},
{title:'فرایند بوت چگونه انجام می‌شود؟',tag:'از روشن شدن تا سیستم‌عامل',lead:'بوت فرایندی مرحله‌ای است که کنترل را از Firmware به راه‌انداز و سپس سیستم‌عامل منتقل می‌کند.',bullets:['۱. روشن شدن و آغاز اجرای Firmware','۲. بررسی و آماده‌سازی سخت‌افزار','۳. انتخاب ورودی بوت','۴. اجرای Bootloader','۵. بارگذاری سیستم‌عامل'],speaker:'احسان',note:'فرایند بوت را به پنج مرحله ساده تقسیم می‌کنیم. ابتدا سیستم روشن می‌شود و Firmware اجرا می‌شود. سپس سخت‌افزارهای ضروری آماده می‌شوند. بعد دستگاه بوت انتخاب می‌شود، Bootloader اجرا می‌شود و در نهایت سیستم‌عامل بارگذاری می‌شود.',scene:'boot',label:'نمایش مرحله‌ای فرایند بوت'},
{title:'MBR و GPT',tag:'ساختار پارتیشن‌بندی',lead:'MBR و GPT دو روش متفاوت برای سازمان‌دهی جدول پارتیشن دیسک هستند.',bullets:['MBR قدیمی‌تر است و محدودیت‌هایی در اندازه دیسک و تعداد پارتیشن‌ها دارد.','GPT روش جدیدتری است و برای دیسک‌های بزرگ‌تر مناسب است.','در بوت UEFI، معمولاً فایل راه‌انداز از پارتیشن EFI System خوانده می‌شود.'],speaker:'احسان',note:'MBR و GPT خودِ BIOS نیستند؛ این دو روش برای نگهداری اطلاعات پارتیشن‌های دیسک هستند. MBR قدیمی‌تر است و محدودیت‌هایی دارد. GPT روش جدیدتر است. در بسیاری از نصب‌های مدرن، UEFI فایل راه‌انداز را از پارتیشن EFI System که معمولاً با FAT32 قالب‌بندی شده اجرا می‌کند.',scene:'disk',label:'ساختار دیسک و پارتیشن'},
{title:'BIOS سنتی در برابر UEFI',tag:'مقایسه',lead:'UEFI استاندارد مدرن‌تری برای راه‌اندازی سیستم است و محدودیت‌های زیادی از روش سنتی را برطرف می‌کند.',bullets:['BIOS سنتی بر پایه سازوکارهای قدیمی و محدودیت‌های MBR شکل گرفته است.','UEFI از GPT و قابلیت‌های پیشرفته‌تر بوت پشتیبانی می‌کند.','رابط گرافیکی یا پشتیبانی از ماوس ممکن است وجود داشته باشد، اما ویژگی تعریف‌کننده UEFI نیست.'],speaker:'احسان',note:'یک نکته مهم این است که UEFI فقط یک BIOS با ظاهر گرافیکی نیست. UEFI یک استاندارد مستقل‌تر و مدرن‌تر برای رابط میان Firmware و فرایند بوت است. پشتیبانی از GPT، ساختار ماژولارتر و امکانات امنیتی از تفاوت‌های مهم آن هستند. داشتن محیط گرافیکی یا ماوس به طراحی سازنده بستگی دارد.',scene:'compare',label:'مقایسه دو نسل راه‌اندازی'},
{title:'Secure Boot و امنیت',tag:'امنیت فرایند بوت',lead:'Secure Boot کمک می‌کند کدهای راه‌انداز غیرمجاز پیش از اجرا شناسایی شوند.',bullets:['امضای دیجیتال اجزای مجاز بوت بررسی می‌شود.','این قابلیت می‌تواند خطر برخی Bootkitها را کاهش دهد.','Secure Boot جایگزین آنتی‌ویروس یا تمام لایه‌های امنیتی نیست.'],speaker:'احسان',note:'Secure Boot قابلیتی در محیط UEFI است که اعتبار امضای دیجیتال اجزای زنجیره بوت را بررسی می‌کند. هدف آن جلوگیری از اجرای برخی کدهای غیرمجاز پیش از بارگذاری سیستم‌عامل است. البته این قابلیت به‌تنهایی امنیت کامل ایجاد نمی‌کند و باید در کنار به‌روزرسانی‌ها و ابزارهای امنیتی دیگر باشد.',scene:'secure',label:'بررسی امضای دیجیتال'},
{title:'به‌روزرسانی BIOS / UEFI',tag:'Firmware Update',lead:'به‌روزرسانی می‌تواند سازگاری، پایداری یا امنیت سیستم را بهبود دهد؛ اما باید با دقت انجام شود.',bullets:['فقط فایل مخصوص مدل دقیق مادربرد یا لپ‌تاپ را دریافت کنید.','دستورالعمل سازنده را مرحله‌به‌مرحله دنبال کنید.','قطع برق یا استفاده از فایل اشتباه ممکن است سیستم را غیرقابل بوت کند.'],speaker:'احسان',note:'به‌روزرسانی Firmware ممکن است برای رفع اشکال، پشتیبانی از پردازنده جدید یا برطرف کردن آسیب‌پذیری امنیتی منتشر شود. این کار باید فقط با فایل رسمی و مخصوص مدل دقیق دستگاه انجام شود. هنگام به‌روزرسانی نباید برق قطع شود و بهتر است بدون نیاز واقعی، این کار را انجام ندهیم.',scene:'update',label:'فرایند به‌روزرسانی'},
{title:'جمع‌بندی',tag:'نتیجه‌گیری',lead:'BIOS و UEFI نقطه آغاز راه‌اندازی رایانه‌اند؛ اما تمام کار سیستم را انجام نمی‌دهند.',bullets:['Firmware سخت‌افزار را بررسی و آماده می‌کند.','سپس دستگاه بوت و Bootloader اجرا می‌شود.','در نهایت سیستم‌عامل کنترل سیستم را به دست می‌گیرد.'],speaker:'احسان',note:'در جمع‌بندی، Firmware نخستین بخش مهم فرایند راه‌اندازی است. قطعات ضروری را بررسی و آماده می‌کند و سپس اجرای راه‌انداز سیستم‌عامل را آغاز می‌کند. پس BIOS یا UEFI پلی میان روشن شدن سخت‌افزار و آغاز اجرای سیستم‌عامل است.',scene:'flow',label:'مسیر نهایی راه‌اندازی'},
{title:'پرسش و پاسخ',tag:'سپاس از توجه شما',lead:'ممنون از توجه شما. خوشحال می‌شویم به پرسش‌های شما پاسخ دهیم.',bullets:['رامیز و احسان نامی','موضوع: BIOS و UEFI','منابع مطالعه: مستندات UEFI Forum و راهنماهای رسمی سازندگان مادربرد'],speaker:'رامیز و احسان',note:'از استاد و دوستان بابت توجه‌شان تشکر می‌کنیم. من و رامیز خوشحال می‌شویم به پرسش‌های شما درباره POST، تفاوت BIOS و UEFI یا فرایند بوت پاسخ بدهیم.',scene:'board',label:'پایان ارائه'}
];
const deck=document.getElementById('deck');
function sceneHTML(type,label){let body='';if(type==='board'||type==='bios')body=`<div class="board"><div class="trace t1"></div><div class="trace t2"></div><div class="trace t3"></div><div class="part cpu">CPU</div><div class="part bios">BIOS</div><div class="part ram"></div><div class="part pch">PCH</div><div class="part bat">CMOS</div><div class="part gpu">PCIe / GPU</div></div>`;
else if(type==='flow'||type==='layers')body=`<div class="diagram">${(type==='layers'?['سخت‌افزار','Firmware','Bootloader','سیستم‌عامل','برنامه‌ها']:['روشن شدن','POST','انتخاب بوت','Bootloader','سیستم‌عامل']).map((x,i)=>`${i?'<span class="arrow">←</span>':''}<div class="node ${i===1?'hot':''}">${x}</div>`).join('')}</div>`;
else if(type==='post')body=`<div class="bootscreen"><div class="bootline">Power on self test</div><div class="bootline">CPU ................. OK</div><div class="bootline">Memory .............. CHECK</div><div class="bootline">Display ............. OK</div><div class="bootline">POST completed</div></div>`;
else if(type==='ram')body=`<div><div class="ramsticks"><i class="stick"></i><i class="stick"></i><i class="stick"></i></div><div style="text-align:center;color:var(--cyan);margin-top:25px">Memory Training · آماده‌سازی حافظه</div></div>`;
else if(type==='battery')body=`<div style="text-align:center"><div class="battery">CR2032</div><p style="color:var(--muted);margin-top:28px">حدود ۳ ولت</p></div>`;
else if(type==='disk')body=`<div style="display:grid;place-items:center;gap:25px"><div class="disk"></div><div class="diagram"><div class="node">MBR</div><div class="node hot">GPT</div><div class="node">EFI System</div></div></div>`;

function setStatus(v,msg,kind=''){const el=v.querySelector('[data-status]');if(el){el.textContent=msg;el.className='lab-status '+kind;}const r=v.querySelector('.sim-readout');if(r)r.textContent=msg;}
function stopLab(v){const t=labTimers.get(v);if(t){clearInterval(t);labTimers.delete(v);}}
function stopClock(v){const t=clockTimers.get(v);if(t){clearInterval(t);clockTimers.delete(v);}}
function startClock(v){stopClock(v);const clock=v.querySelector('[data-clock]');if(!clock)return;let seconds=10*3600+24*60+8;const draw=()=>{seconds++;clock.textContent=[Math.floor(seconds/3600)%24,Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');};const t=setInterval(draw,1000);clockTimers.set(v,t);}
function resetLab(v){stopLab(v);stopClock(v);const lab=v.querySelector('.sim-lab');if(!lab)return;lab.innerHTML=labMarkup(v.dataset.sim);if(v.dataset.sim==='battery')startClock(v);v.querySelector('.sim-count').textContent='آماده اجرا';v.querySelectorAll('.sim-active').forEach(x=>x.classList.remove('sim-active'));}
function runSequence(v,steps,done){stopLab(v);let i=0;const tick=()=>{if(i>=steps.length){stopLab(v);if(done)done();return;}steps[i++]();};tick();const timer=setInterval(tick,1050);labTimers.set(v,timer);}
function handleLabClick(e,v){const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;const lab=v.querySelector('.sim-lab');
 if(a==='reset'){resetLab(v);return;}
 if(a==='power-on'){const cards=[...lab.querySelectorAll('[data-power]')];const names=['psu','board','cpu','bios'];const labels=['Power Good · برق پایدار','مدارهای مادربرد فعال شدند','CPU از حالت Reset خارج شد','کد Firmware از SPI Flash اجرا شد'];runSequence(v,cards.map((c,i)=>()=>{c.classList.add('pass');c.querySelector('span').textContent=labels[i];setStatus(v,labels[i], 'ok');}),()=>setStatus(v,'Firmware اجرا شد؛ اکنون نوبت POST و آماده‌سازی سخت‌افزار است.','ok'));return;}
 if(a==='post-run'){const fault=lab.querySelector('[data-fault]').value;const cards=[...lab.querySelectorAll('[data-check]')];cards.forEach(c=>{c.className='lab-card';c.querySelector('span').textContent='در انتظار آزمون';});let n=0;const names=['CPU','RAM','GPU / VGA','Keyboard'];runSequence(v,cards.map((c,i)=>()=>{const bad=(fault==='ram'&&i===1)||(fault==='gpu'&&i===2)||(fault==='cpu'&&i===0);c.classList.add(bad?'fail':'pass');c.querySelector('span').textContent=bad?'خطا · پاسخ دریافت نشد':'آزمون موفق';setStatus(v,`${names[i]}: ${bad?'خطا شناسایی شد':'پاسخ صحیح دریافت شد'}`,bad?'bad':'ok');}),()=>setStatus(v,fault==='none'?'POST با موفقیت کامل شد؛ سیستم می‌تواند به مرحله بوت برود.':`POST متوقف شد: خطای ${fault.toUpperCase()} مانع ادامه راه‌اندازی است.` ,fault==='none'?'ok':'bad'));return;}
 if(a==='ram-run'){const lanes=[...lab.querySelectorAll('[data-lane]')],mods=[...lab.querySelectorAll('[data-ram]')];mods.forEach(x=>x.classList.add('active'));let n=0;runSequence(v,[()=>{lanes[0].style.width='100%';setStatus(v,'مرحله ۱: اطلاعات SPD خوانده شد؛ نوع حافظه و پروفایل‌های پشتیبانی‌شده شناسایی شدند.');},()=>{lanes[1].style.width='58%';setStatus(v,'مرحله ۲: Memory Training آغاز شد؛ کنترلر حافظه پارامترهای سیگنال و زمان‌بندی را تنظیم می‌کند.');},()=>{lanes[1].style.width='100%';lanes[2].style.width='75%';setStatus(v,'مرحله ۳: الگوهای آزمایشی برای ارزیابی ارتباط حافظه ارسال می‌شوند.');},()=>{lanes[2].style.width='100%';setStatus(v,`آماده‌سازی کامل شد: ${lab.querySelector('[data-memory]').value} · حافظه آماده استفاده است.`,'ok');}]);return;}
 if(a==='battery-out'||a==='battery-in'||a==='battery-reset'){const connected=a==='battery-in'||a==='battery-reset';const b=lab.querySelector('[data-batstate]'),c=lab.querySelector('[data-cmosstate]');b.className='lab-card '+(connected?'pass':'fail');b.querySelector('span').textContent=connected?'باتری متصل · 3.0 V':'باتری خارج شده · 0 V';c.className='lab-card '+(connected?'pass':'fail');c.querySelector('span').textContent=connected?'تنظیمات نمونه حفظ / بازیابی شد':'برق پشتیبان قطع؛ تنظیمات نمونه از دست رفت';if(!connected){stopClock(v);lab.querySelector('[data-clock]').textContent='00:00:00';setStatus(v,'باتری از مدار خارج شد؛ در این مدل آموزشی، مدار RTC دیگر برق پشتیبان ندارد و ساعت نمونه متوقف شد.','bad');}else{lab.querySelector('[data-clock]').textContent='10:24:08';startClock(v);setStatus(v,a==='battery-reset'?'تنظیمات نمونه به مقادیر پیش‌فرض بازگشت.':'باتری دوباره متصل شد؛ مدار ساعت پشتیبان دریافت می‌کند.','ok');}return;}
 if(a==='setup-save'){const choice=lab.querySelector('[data-bootselect]').value;lab.querySelector('[data-savestate]').textContent='Saved';setStatus(v,`تنظیمات نمونه ذخیره شد. Boot Option #1 = ${choice}. در UEFI واقعی، ذخیره تنظیمات معمولاً با Save & Exit انجام می‌شود.`,'ok');return;}
 if(a==='boot-next'||a==='generic-next'){const nodes=[...lab.querySelectorAll('[data-bootnode]')];let n=Number(v.dataset.labstep||0);nodes.forEach((x,i)=>{x.classList.toggle('active',i===n);if(i<n)x.classList.add('done');});if(n<nodes.length){setStatus(v,`مرحله ${n+1}: ${nodes[n].textContent} فعال شد.`,'ok');v.dataset.labstep=String(n+1);}else setStatus(v,'توالی کامل شد. سیستم‌عامل آماده استفاده است.','ok');return;}
 if(a==='boot-auto'){const nodes=[...lab.querySelectorAll('[data-bootnode]')];v.dataset.labstep='0';runSequence(v,nodes.map((node,i)=>()=>{nodes.forEach((x,j)=>{x.classList.toggle('active',j===i);if(j<i)x.classList.add('done');});setStatus(v,`مرحله ${i+1}: ${node.textContent}؛ کنترل به مرحله بعد منتقل می‌شود.`);}),()=>setStatus(v,'سیستم‌عامل بارگذاری شد؛ فرایند بوت کامل است.','ok'));return;}
 if(a==='secure-check'){const mode=lab.dataset.filemode||'valid';const file=lab.querySelector('[data-file]');if(mode==='valid'){file.textContent='هش فایل با امضا مطابقت دارد';setStatus(v,'امضای دیجیتال معتبر است؛ فایل در این مدل آموزشی اجازه ادامه بوت می‌گیرد.','ok');}else{file.textContent='محتوای فایل تغییر کرده است';setStatus(v,'اعتبارسنجی ناموفق: امضا با محتوای فایل مطابقت ندارد؛ Secure Boot اجرای آن را رد می‌کند.','bad');}return;}
 if(a==='flash-run'){const cells=[...lab.querySelectorAll('.flash-cells i')];const stages=[()=>{cells.forEach(x=>x.className='erased');lab.querySelector('[data-flash="bank"] span').textContent='پاک‌سازی بانک A';setStatus(v,'مرحله ۱ · Erase: بلوک‌های انتخاب‌شده در حافظه Flash پاک‌سازی می‌شوند.');},()=>{cells.forEach((x,i)=>{if(i%3!==0)x.className='written';});lab.querySelector('[data-flash="version"] span').textContent='نسخه نمونه 1.05';lab.querySelector('[data-flash="bank"] span').textContent='نوشتن داده جدید';setStatus(v,'مرحله ۲ · Write: داده Firmware جدید در بلوک‌های حافظه نوشته می‌شود.');},()=>{lab.querySelector('[data-flash="verify"] span').textContent='Checksum OK';lab.querySelector('[data-flash="verify"]').classList.add('pass');setStatus(v,'مرحله ۳ · Verify: صحت داده نوشته‌شده بررسی شد؛ چرخه نمایشی کامل است.','ok');}];runSequence(v,stages);return;}
 }
document.addEventListener('click',e=>{const v=e.target.closest('.visual[data-sim]');if(!v)return;const tab=e.target.closest('[data-tab]');if(tab){const lab=v.querySelector('.sim-lab');lab.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===tab));const key=tab.dataset.tab;const status=key==='boot'?'بخش Boot: ترتیب دستگاه‌های راه‌اندازی را انتخاب کنید.':key==='advanced'?'بخش Advanced: تنظیمات نمونه مجازی‌سازی و مدیریت سخت‌افزار را نمایش می‌دهد.':'بخش Security: وضعیت Secure Boot و گزینه‌های امنیتی را بررسی کنید.';setStatus(v,status);const cards=lab.querySelector('[data-settings]');if(cards){cards.innerHTML=key==='boot'?'<div class="lab-card"><b>Boot Option #1</b><select class="lab-select" data-bootselect><option>NVMe SSD</option><option>USB Storage</option><option>Network PXE</option></select></div><div class="lab-card"><b>Boot Option #2</b><span>USB Storage</span></div><div class="lab-card"><b>Fast Boot</b><span>Enabled</span></div><div class="lab-card"><b>Save State</b><span data-savestate>Not saved</span></div>':key==='advanced'?'<div class="lab-card"><b>Virtualization</b><span>Enabled</span></div><div class="lab-card"><b>CPU Configuration</b><span>Auto</span></div><div class="lab-card"><b>Memory Profile</b><span>Auto</span></div><div class="lab-card"><b>Power Management</b><span>Balanced</span></div>':'<div class="lab-card"><b>Secure Boot</b><span>Enabled</span></div><div class="lab-card"><b>TPM / Security Device</b><span>Available</span></div><div class="lab-card"><b>Administrator Password</b><span>Not configured</span></div><div class="lab-card"><b>Key Management</b><span>Standard</span></div>'; }return;}handleLabClick(e,v);});
document.addEventListener('change',e=>{const v=e.target.closest('.visual[data-sim]');if(!v)return;const lab=v.querySelector('.sim-lab');if(e.target.matches('[data-filemode]')){lab.dataset.filemode=e.target.dataset.filemode;lab.querySelectorAll('[data-filemode]').forEach(b=>b.classList.toggle('active',b===e.target));setStatus(v,e.target.dataset.filemode==='valid'?'فایل اصلی انتخاب شد.':'فایل دست‌کاری‌شده انتخاب شد؛ یک تغییر فرضی در محتوای آن ایجاد شده است.');}if(e.target.matches('[data-disk]')){lab.querySelectorAll('[data-disk]').forEach(b=>b.classList.toggle('active',b===e.target));const view=lab.querySelector('[data-diskview]');view.innerHTML=(e.target.dataset.disk==='gpt'?['Protective MBR','GPT Header','Partition Entries','EFI System']:['MBR Boot Code','Partition Table','Primary Partitions','Boot Sector']).map((x,i)=>`<div class="lab-card ${i===1?'pass':''}"><b>${x}</b><span>${e.target.dataset.disk.toUpperCase()}</span></div>`).join('');setStatus(v,e.target.dataset.disk==='gpt'?'GPT: هدر، جدول پارتیشن و در صورت نیاز پارتیشن EFI بررسی می‌شوند.':'MBR: کد راه‌انداز و جدول پارتیشن در ساختار قدیمی‌تر MBR قرار دارند.');}});
let index=0;function show(n){const old=document.querySelectorAll('.slide')[index]?.querySelector('.visual[data-sim]');if(old){stopLab(old);stopClock(old);}index=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===index));document.getElementById('bar').style.width=((index+1)/slides.length*100)+'%';document.getElementById('counter').textContent=(index+1)+' / '+slides.length;let s=slides[index];document.getElementById('notes').innerHTML='<b>یادداشت تمرین · '+s.speaker+'</b><br>'+s.note;const v=document.querySelectorAll('.slide')[index]?.querySelector('.visual[data-sim]');if(v){v.dataset.labstep='0';resetLab(v);}}
function next(){show(index+1)}function prev(){show(index-1)}function toggleNotes(){document.getElementById('notes').classList.toggle('show')}function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();prev()}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f')toggleFull();if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)show(index+(d<0?1:-1))},{passive:true});show(0);
</script></body></html>
