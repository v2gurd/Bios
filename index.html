<style>

#np{display:none;position:fixed;left:2vw;bottom:2vh;width:min(560px,50vw);max-height:38vh;overflow:auto;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--ac);border-radius:18px;padding:16px 20px;z-index:8;line-height:2.1;font-size:clamp(15px,1.5vw,19px)}

#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

.p{cursor:pointer}.p:hover{filter:brightness(1.4)}

'در سیستم قدیمی، ۵۱۲ بایت اول دیسک به نام MBR با امضای 55AA برای بوت استفاده می‌شد و تا ۲ ترابایت پشتیبانی داشت. GPT پارتیشن‌بندی مدرن برای دیسک‌های بزرگ‌تر است. در UEFI بوت‌لودر داخل پارتیشن ESP با فرمت FAT32 قرار دارد.',
'BIOS قدیمی ۱۶ بیتی است، از MBR استفاده می‌کند، رابط متنی دارد و کندتر بوت می‌شود. UEFI ۳۲ یا ۶۴ بیتی است، GPT را پشتیبانی می‌کند، رابط گرافیکی با ماوس دارد و سریع‌تر بوت می‌شود. امروز تقریباً همه‌ی مادربردها UEFI هستند.',
