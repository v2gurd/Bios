<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIOS؛ مغز راه‌انداز کامپیوتر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:rgba(14,20,36,.8);--tx:#e8eefc;--mut:#93a1c4;--ac:#38e1c6;--ac2:#7c8cff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e9eefb;--card:rgba(255,255,255,.88);--tx:#0e1526;--mut:#4d5c7d;--ac:#079a84;--ac2:#4453d8}}
:root[data-theme="dark"]{--bg:#070b14}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;overflow:hidden;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 30% 20%,color-mix(in srgb,var(--ac2) 22%,transparent),transparent 55%),radial-gradient(ellipse at 80% 90%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 50%),var(--bg)}
#stage{position:absolute;inset:0;perspective:1500px;--sx:-15vw;--sy:0vh}
#cam{position:absolute;left:50%;top:50%;transform:translate(var(--sx),var(--sy));transform-style:preserve-3d;transition:transform 1.2s ease}
#float{transform-style:preserve-3d;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
#board{position:absolute;left:-500px;top:-350px;width:1000px;height:700px;border-radius:16px;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.65,0,.2,1);
background:linear-gradient(rgba(56,225,198,.07) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(56,225,198,.07) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(135deg,#0f4a45,#0b2f45);
box-shadow:0 2px 0 #08303a,0 4px 0 #072a33,0 6px 0 #06242c,0 8px 0 #051e25,0 40px 60px rgba(0,0,0,.55)}
svg.tr{position:absolute;inset:0;width:100%;height:100%}
.tr path{fill:none;stroke:var(--ac);stroke-width:3;stroke-dasharray:8 14;opacity:.55;animation:fw 2s linear infinite}
@keyframes fw{to{stroke-dashoffset:-44}}
.p{position:absolute;border-radius:6px;transform:translateZ(var(--z));--e:#0a111f;background:#1a2438;box-shadow:1px 1px 0 var(--e),2px 2px 0 var(--e),3px 3px 0 var(--e),4px 4px 0 var(--e),6px 8px 10px rgba(0,0,0,.55);transition:opacity .8s,box-shadow .8s;display:flex;align-items:center;justify-content:center;font:700 13px monospace;color:#cfd8ea}
.p::before{content:attr(data-t);position:absolute;top:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 17px Vazirmatn,sans-serif;background:var(--ac);color:#04111a;padding:2px 12px;border-radius:99px;opacity:0;transition:opacity .6s .8s}
.focus .p{opacity:.35}
.focus .p.on{opacity:1;animation:pu 2s ease-in-out infinite}
.p.on::before{opacity:1}
@keyframes pu{50%{box-shadow:1px 1px 0 var(--e),2px 2px 0 var(--e),3px 3px 0 var(--e),4px 4px 0 var(--e),0 0 40px 8px var(--ac)}}
.io{background:repeating-linear-gradient(90deg,#8b97ad 0 14px,#6d7890 14px 16px)}
.cpu{background:linear-gradient(#2a3552,#2a3552) center/60% 60% no-repeat,repeating-linear-gradient(0deg,#c9a24a 0 3px,#3a2f12 3px 6px);border:6px solid #2b3550}
.cpu{font-size:22px}
.ram{background:#0d1526;flex-direction:row;gap:10px;padding:8px}
.ram i{flex:1;height:100%;background:linear-gradient(#20304f,#0b1120);border-radius:3px;border:1px solid #38e1c644}
.chip{background:#0a0d14;border:2px solid #c9a24a;font-size:20px;color:#fff;letter-spacing:2px}
.chip::after{content:"";position:absolute;left:6px;top:6px;width:7px;height:7px;border-radius:50%;background:#c9a24a}
.bat{border-radius:50%;background:radial-gradient(circle,#dfe6f2,#8894aa);color:#233;font-size:14px}
.pch{background:repeating-linear-gradient(90deg,#3b4a6b 0 8px,#222c45 8px 12px);color:#fff}
.pcie{background:#0b0f19;border:2px solid #232d47}
.sata{background:#0b0f19;border:2px solid #38e1c655;border-radius:4px}
.pwr{background:#e8e8ee;color:#333}
#card{position:fixed;top:50%;right:4vw;width:min(440px,36vw);transform:translateY(-50%);background:var(--card);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);border-radius:22px;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#card .k{color:var(--ac);font:700 13px monospace;letter-spacing:2px}
#card h2{margin:6px 0 14px;font-size:clamp(24px,3.2vw,38px);font-weight:900;line-height:1.35}
#card h2 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#card ul{list-style:none;margin:0;padding:0}
#card li{position:relative;padding:0 22px 0 0;margin:0 0 10px;color:var(--mut);line-height:1.9;font-size:clamp(14px,1.25vw,17px);opacity:0;transform:translateY(14px);animation:in .7s forwards;animation-delay:calc(.9s + var(--d)*.28s)}
#card li::before{content:"";position:absolute;right:0;top:.85em;width:9px;height:9px;border-radius:3px;background:var(--ac);transform:rotate(45deg)}
#card li b{color:var(--tx)}
#card .k,#card h2{animation:in .8s both}
@keyframes in{to{opacity:1;transform:none}}
#nav{display:flex;align-items:center;gap:10px;margin-top:18px}
#nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:20px;cursor:pointer;transition:.25s}
#nav button:hover{background:var(--ac);color:#04111a;transform:scale(1.1)}
#dots{flex:1;display:flex;gap:6px;justify-content:center}
#dots i{width:8px;height:8px;border-radius:99px;background:var(--mut);opacity:.4;transition:.4s;cursor:pointer}
#dots i.a{width:26px;background:var(--ac);opacity:1}
@media (max-width:800px){#stage{--sx:0vw;--sy:-17vh}#card{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;left:12px;width:auto;transform:none;padding:16px 18px;max-height:46vh;overflow:auto}#card li{margin-bottom:5px}}
#nb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:9;border:1px solid var(--ac);background:var(--card);color:var(--ac);border-radius:99px;padding:6px 14px;font:700 13px Vazirmatn,Tahoma,sans-serif;cursor:pointer;backdrop-filter:blur(10px)}
#np{display:none;position:fixed;left:2vw;bottom:2vh;width:min(560px,50vw);max-height:38vh;overflow:auto;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--ac);border-radius:18px;padding:16px 20px;z-index:8;line-height:2.1;font-size:clamp(15px,1.5vw,19px)}
.sn #np{display:block}
@media (max-width:800px){#np{left:12px;right:12px;width:auto;top:calc(56px + env(safe-area-inset-top,0px));bottom:auto;max-height:34vh}}
</style>
</head>

</div></div></div></div>

<script>
var P=[['io',20,60,110,270,4,'','I/O'],['cpu',380,200,180,180,6,'CPU','CPU'],['ram',620,70,90,270,6,'','RAM'],['chip',300,470,90,50,14,'BIOS','BIOS / UEFI Flash'],['bat',160,500,80,80,10,'CR2032','باتری CMOS'],['pch',520,430,100,100,10,'PCH','چیپست'],['pcie',430,590,470,26,5,'','PCIe'],['pcie',430,640,470,26,5,'','PCIe'],['sata',850,400,90,90,6,'SATA','درگاه SATA / NVMe'],['pwr',870,60,90,50,8,'ATX','تغذیه']];
var B=document.getElementById('board'),els={};
P.forEach(function(p){var d=document.createElement('div');d.className='p '+p[0];d.dataset.t=p[7];d.style.cssText='left:'+p[1]+'px;top:'+p[2]+'px;width:'+p[3]+'px;height:'+p[4]+'px;--z:'+p[5]+'px';d.innerHTML=p[0]=='ram'?'<i></i><i></i><i></i><i></i>':p[6];B.appendChild(d);(els[p[0]]=els[p[0]]||[]).push(d)});
var S=[
{id:'',x:500,y:350,s:.95,rx:55,rz:-28,k:'ارائه‌ی درس',h:'<span>BIOS</span><br>مغز راه‌انداز کامپیوتر',l:['<b>ارائه‌دهنده:</b> احسان نامی','<b>استاد:</b> هلیا کوشا','با کلیدهای ← → یا دکمه‌ها جلو برو']},
{id:'',x:500,y:350,s:.9,rx:50,rz:22,h:'فهرست مطالب',l:['<b>۱)</b> مادربرد و BIOS: تعریف و تاریخچه','<b>۲)</b> حافظه، POST، RAM و CMOS','<b>۳)</b> پیکربندی و راه‌اندازی دستگاه‌ها','<b>۴)</b> فرایند بوت','<b>۵)</b> UEFI، امنیت و به‌روزرسانی']},
{id:'io',x:75,y:195,s:2.3,rx:35,rz:0,h:'مادربرد چیست؟',l:['برد اصلی که CPU، RAM، ذخیره‌ساز و درگاه‌ها را به هم وصل می‌کند','مسیرهای مسی (Trace) داده و برق را بین قطعات جابه‌جا می‌کنند','BIOS روی همین برد، قطعات را برای کار آماده می‌کند']},
{id:'chip',x:345,y:495,s:2.6,rx:35,rz:0,h:'BIOS چیست؟',l:['<b>Basic Input/Output System</b>؛ فرم‌ور روی تراشه‌ی فلش مادربرد','اولین کدی که پس از روشن شدن اجرا می‌شود','واسط بین سخت‌افزار و سیستم‌عامل']},
{id:'chip',x:345,y:495,s:2.2,rx:38,rz:0,h:'تاریخچه‌ی BIOS',l:['واژه‌ی BIOS در سیستم‌عامل CP/M (سال ۱۹۷۵) به کار رفت','۱۹۸۱: IBM PC با BIOS داخل ROM؛ دهه‌ی ۸۰: شرکت‌های Phoenix، AMI و Award نسخه‌های سازگار ساختند','Intel در حدود ۲۰۰۰ برای Itanium نسخه‌ی EFI را ساخت؛ ۲۰۰۵: تأسیس UEFI Forum']},
{id:'chip',x:345,y:495,s:3.2,rx:32,rz:0,h:'حافظه‌ی نگه‌دارنده‌ی BIOS',l:['تکامل: ROM ← EPROM ← EEPROM ← <b>Flash (SPI)</b>','حافظه‌ی فلش غیرفرار است و بدون برق هم کد را نگه می‌دارد','قابل بازنویسی است؛ پایه‌ی به‌روزرسانی BIOS']},
{id:'cpu',x:470,y:290,s:3,rx:28,rz:0,h:'POST؛ خودآزمایی اولیه',l:['<b>Power-On Self-Test</b>: بررسی CPU، RAM، گرافیک و کیبورد','خطا؟ بوق‌های هشدار (Beep Code) یا کد خطای LED','شروع: CPU از آدرس ثابت (<b>Reset Vector</b>) کد BIOS را اجرا می‌کند']},
{id:'ram',x:665,y:205,s:2.4,rx:30,rz:0,h:'بررسی و راه‌اندازی RAM',l:['BIOS مشخصات ماژول‌ها را از تراشه‌ی SPD می‌خواند','مرحله‌ی <b>Memory Training</b> سرعت و زمان‌بندی را تنظیم می‌کند','بدون RAM سالم، بوت ادامه پیدا نمی‌کند']},
{id:'bat',x:200,y:540,s:2.8,rx:35,rz:0,h:'حافظه‌ی CMOS و باتری',l:['تنظیمات (ساعت، ترتیب بوت و ...) در <b>CMOS</b> ذخیره می‌شود','باتری <b>CR2032</b> (حدود ۳ ولت) آن را زنده نگه می‌دارد','باتری تمام شود: ساعت ریست و تنظیمات پیش‌فرض می‌شود']},
{id:'pch',x:570,y:480,s:2.6,rx:32,rz:0,h:'چیپست و پیکربندی',l:['چیپست (PCH) پل ارتباطی CPU با دستگاه‌هاست','BIOS دستگاه‌ها را شناسایی و منابع (IRQ، آدرس) را تخصیص می‌دهد','برای Setup کلید <b>Del</b> یا <b>F2</b> را بزن']},
{id:'pch',x:570,y:480,s:3.2,rx:28,rz:0,h:'صفحه‌ی BIOS Setup',l:['<b>Boot:</b> ترتیب بوت (SSD، USB، ...)','<b>Advanced:</b> مجازی‌سازی، اورکلاک، مدیریت انرژی','<b>Security:</b> رمز BIOS، Secure Boot','ذخیره و خروج با <b>F10</b>']},
{id:'pcie',x:665,y:603,s:2.6,rx:32,rz:0,h:'Option ROM و کارت‌های جانبی',l:['کارت‌ها (مثل گرافیک) کد راه‌اندازی خودشان را دارند (Option ROM)','BIOS این کد را اجرا می‌کند تا تصویر روی نمایشگر بیاید','شبکه و کنترلر RAID هم می‌توانند Option ROM داشته باشند']},
{id:'sata',x:895,y:445,s:2.5,rx:32,rz:0,h:'فرایند بوت',l:['۱. روشن شدن ← ۲. POST','۳. جست‌وجوی دستگاه بوت (SSD/HDD/USB)','۴. خواندن <b>بوت‌لودر</b>','۵. واگذاری کنترل به سیستم‌عامل']},
{id:'sata',x:895,y:445,s:3.4,rx:28,rz:0,h:'MBR و GPT',l:['<b>MBR:</b> ۵۱۲ بایت اول دیسک با امضای 55AA و پشتیبانی تا ۲ ترابایت','<b>GPT:</b> پارتیشن‌بندی مدرن برای دیسک‌های بزرگ‌تر','در UEFI بوت‌لودر داخل پارتیشن <b>ESP</b> (FAT32) قرار دارد']},
{id:'chip',x:345,y:495,s:2.2,rx:35,rz:0,h:'BIOS در برابر UEFI',l:['<b>BIOS قدیمی:</b> ۱۶ بیتی، MBR، رابط متنی، بوت کندتر','<b>UEFI:</b> ۳۲/۶۴ بیتی، GPT، رابط گرافیکی با ماوس، بوت سریع‌تر','امروز تقریباً همه‌ی مادربردها UEFI هستند']},
{id:'chip',x:345,y:495,s:2.8,rx:32,rz:0,h:'امنیت و Secure Boot',l:['<b>Secure Boot</b> امضای بوت‌لودر را قبل از اجرا بررسی می‌کند','تهدید: Bootkit و روت‌کیت‌ها؛ ویروس CIH (۱۹۹۸) حتی BIOS را بازنویسی می‌کرد','رمز Setup و TPM لایه‌های حفاظتی دیگرند']},
{id:'pwr',x:915,y:85,s:2.6,rx:32,rz:0,h:'به‌روزرسانی BIOS',l:['برای رفع باگ، پشتیبانی CPU جدید و وصله‌ی امنیتی انجام می‌شود','<b>خطر:</b> قطع برق حین Flash می‌تواند برد را از کار بیندازد (Brick)','قبل از شروع برق پایدار را مطمئن شو؛ برخی بردها Dual BIOS دارند']},
{id:'',x:500,y:350,s:.95,rx:55,rz:28,k:'جمع‌بندی',h:'از برق تا سیستم‌عامل',l:['BIOS/UEFI پلی است بین سخت‌افزار و نرم‌افزار','مراحل: Reset ← POST ← پیکربندی ← بوت','منابع: مستندات UEFI Forum، Intel و سازندگان مادربرد','<b>ممنون از توجه شما 🙏</b>']}
];
var N=[
'سلام و وقت بخیر. من احسان نامی هستم و امروز درباره‌ی BIOS ارائه می‌دهم؛ همان چیزی که کامپیوتر را از یک سخت‌افزار بی‌جان به یک سیستم زنده تبدیل می‌کند. ممنون از خانم کوشا که این فرصت را دادند.',
'اول مادربرد و تعریف BIOS را می‌بینیم. بعد حافظه، POST، RAM و CMOS. بعد پیکربندی دستگاه‌ها، بعد فرایند بوت و در آخر UEFI، امنیت و به‌روزرسانی.',
'مادربرد برد اصلی کامپیوتر است و CPU، RAM، ذخیره‌ساز و درگاه‌ها را به هم وصل می‌کند. مسیرهای مسی روی آن، داده و برق را جابه‌جا می‌کنند. اما قطعات به‌تنهایی نمی‌دانند چطور با هم کار کنند؛ اینجا BIOS وارد می‌شود.',
'BIOS مخفف Basic Input/Output System است. یک فرم‌ور است که روی تراشه‌ی فلش مادربرد ذخیره شده. اولین کدی است که بعد از روشن شدن اجرا می‌شود و واسط بین سخت‌افزار و سیستم‌عامل است.',
'اصطلاح BIOS اولین بار در سیستم‌عامل CP/M در سال ۱۹۷۵ به کار رفت. در ۱۹۸۱ IBM PC با BIOS داخل ROM آمد و در دهه‌ی ۸۰ شرکت‌هایی مثل Phoenix، AMI و Award نسخه‌های سازگار ساختند. Intel حدود ۲۰۰۰ برای Itanium نسخه‌ی EFI را ساخت و در ۲۰۰۵ UEFI Forum تأسیس شد.',
'حافظه‌ی BIOS تکامل پیدا کرد: ROM، بعد EPROM، بعد EEPROM و در نهایت Flash. فلش غیرفرار است و بدون برق هم کد را نگه می‌دارد. چون قابل بازنویسی است، به‌روزرسانی BIOS ممکن شده.',
'POST یعنی Power-On Self-Test، خودآزمایی اولیه. CPU از یک آدرس ثابت به اسم Reset Vector شروع به اجرای کد BIOS می‌کند. BIOS کارکرد CPU، RAM، گرافیک و کیبورد را بررسی می‌کند و اگر مشکلی باشد با بوق‌های هشدار یا کد خطا خبر می‌دهد. الگوی بوق‌ها در AMI و Award فرق دارد.',
'BIOS مشخصات ماژول‌های RAM را از تراشه‌ی SPD می‌خواند. بعد مرحله‌ی Memory Training سرعت و زمان‌بندی را تنظیم می‌کند. اگر RAM سالم نباشد، بوت ادامه پیدا نمی‌کند.',
'تنظیمات مثل ساعت و ترتیب بوت در حافظه‌ی CMOS ذخیره می‌شوند. این حافظه با باتری CR2032 و حدود ۳ ولت زنده می‌ماند. اگر باتری تمام شود، ساعت ریست می‌شود و تنظیمات به پیش‌فرض برمی‌گردد.',
'چیپست یا PCH پل ارتباطی CPU با بقیه‌ی دستگاه‌هاست. BIOS دستگاه‌ها را شناسایی می‌کند و منابعی مثل IRQ و آدرس را به آن‌ها می‌دهد. برای ورود به تنظیمات باید کلید Del یا F2 را بزنیم.',
'در Setup چند بخش اصلی داریم. در Boot ترتیب بوت را می‌گذاریم. در Advanced مجازی‌سازی، اورکلاک و مدیریت انرژی را تنظیم می‌کنیم. در Security رمز BIOS و Secure Boot را می‌بینیم و با F10 ذخیره می‌کنیم و خارج می‌شویم.',
'کارت‌های جانبی مثل گرافیک، کد راه‌اندازی خودشان را دارند که به آن Option ROM می‌گویند. BIOS این کد را اجرا می‌کند تا مثلاً تصویر روی نمایشگر بیاید. کارت شبکه و کنترلر RAID هم می‌توانند Option ROM داشته باشند.',
'ترتیب را مرور کنیم: روشن شدن، بعد POST، بعد BIOS دنبال دستگاه بوت می‌گردد؛ SSD، هارد یا USB. بعد بوت‌لودر را می‌خواند و در نهایت کنترل را به سیستم‌عامل می‌دهد.',
